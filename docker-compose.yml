networks:
  prod_network:
    driver: bridge
  stage_network:
    driver: bridge

services:
  nginx:
    image: nginx:1.29.7-alpine
    container_name: api_proxy
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./etc/nginx/templates:/etc/nginx/templates
    environment:
      STAGE_SERVER_NAME: ${STAGE_SERVER_NAME}
      PROD_SERVER_NAME: ${PROD_SERVER_NAME}
      STAGE_API_HOST: api_stage
      PROD_API_HOST: api_prod
      API_PORT: ${API_PORT}
    networks:
      - prod_network
      - stage_network

# ===============================================================================

  db_prod:
    image: postgres:17-alpine
    container_name: prod-analytics-db
    env_file: 
      - path: "./prod.env"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod_network

  api_prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod-analytics-api
    restart: unless-stopped
    env_file: 
      - path: "./.env"
      - path: "./prod.env"
    depends_on:
      db_prod:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${PROD_POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    networks:
      - prod_network

# ===============================================================================

  db_stage:
    image: postgres:17-alpine
    container_name: stage-analytics-db
    restart: unless-stopped
    env_file: 
      - path: "./stage.env"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - stage_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stage_network

  api_stage:
    env_file: 
      - path: "./.env"
      - path: "./stage.env"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stage-analytics-api
    restart: unless-stopped
    depends_on:
      db_stage:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${STAGE_POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    networks:
      - stage_network

volumes:
  prod_db_data:
  stage_db_data: