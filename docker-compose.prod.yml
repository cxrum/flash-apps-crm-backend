services:
  nginx:
    image: nginx:1.29.7-alpine
    container_name: prod-analytics-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./etc/nginx/templates/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
    env_file:
      - path: ./prod.env
    environment:
      API_HOST: api
    depends_on:
      api:
        condition: service_started
    networks:
      - prod_network

  db:
    image: postgres:17-alpine
    container_name: prod-analytics-db
    restart: unless-stopped
    env_file:
      - path: ./prod.env
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod_network

  redis:
    image: redis:8-alpine
    container_name: prod-analytics-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - prod_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod-analytics-api
    restart: unless-stopped
    env_file:
      - path: ./prod.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod_network

networks:
  prod_network:
    driver: bridge

volumes:
  prod_db_data:
  prod_redis_data:
