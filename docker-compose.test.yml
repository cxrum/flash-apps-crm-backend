services:
  nginx:
    image: nginx:1.29.7-alpine
    container_name: test-analytics-proxy
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./etc/nginx/templates/nginx.test.conf.template:/etc/nginx/templates/default.conf.template:ro
    env_file:
      - path: ./test.env
    environment:
      API_HOST: api
    depends_on:
      api:
        condition: service_started
    networks:
      - test_network

  db:
    image: postgres:17-alpine
    container_name: test-analytics-db
    restart: unless-stopped
    env_file:
      - path: ./test.env
    ports:
      - "5432:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test_network

  redis:
    image: redis:8-alpine
    container_name: test-analytics-redis
    command: redis-server --appendonly yes
    volumes:
      - test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-analytics-api
    env_file:
      - path: ./test.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - test_network

networks:
  test_network:
    driver: bridge

volumes:
  test_db_data:
  test_redis_data:
